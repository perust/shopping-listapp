<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-body: #333333;
      --text-muted: #888888;
      --text-faint: #aaaaaa;
      --border: #dddddd;
      --accent: #4361ee;
      --accent-hover: #3a56d4;
      --danger: #e74c3c;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --card: #21242b;
        --text: #e8eaed;
        --text-body: #d5d8dd;
        --text-muted: #8b8f99;
        --text-faint: #6b7080;
        --border: #3a3f4b;
        --accent: #6b83f5;
        --accent-hover: #8093f7;
        --danger: #ff6b5b;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* display를 지정한 요소는 hidden 속성만으로 숨겨지지 않으므로 여기서 확실히 눌러 준다 */
    [hidden] { display: none !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      color: var(--text);
    }

    .account {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .account-email {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
      min-height: 18px;
    }

    .status.error {
      color: var(--danger);
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      background: var(--card);
      color: var(--text-body);
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: var(--accent);
    }

    .input-row button {
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: var(--accent-hover);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      min-height: 22px;
    }

    .stats {
      font-size: 14px;
      color: var(--text-muted);
    }

    .clear-btn {
      background: none;
      border: none;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .clear-btn:hover {
      color: var(--danger);
    }

    .clear-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      transition: opacity 0.2s;
    }

    li.checked {
      opacity: 0.55;
    }

    /* 기본 체크박스의 모양만 덮어써서 키보드·스크린리더 지원은 그대로 살린다 */
    li .checkbox {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    li .checkbox:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    li .checkbox:checked::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 45%;
      width: 5px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    li .checkbox:focus-visible,
    li .delete-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    li .name {
      flex: 1;
      font-size: 16px;
      color: var(--text-body);
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    li.checked .name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    li .delete-btn {
      background: none;
      border: none;
      border-radius: 4px;
      color: var(--text-faint);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    li .delete-btn:hover {
      color: var(--danger);
    }

    .empty {
      text-align: center;
      color: var(--text-faint);
      padding: 40px 0;
      font-size: 15px;
    }

    .sync {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .sync-label {
      font-size: 13px;
      color: var(--text-faint);
      margin-bottom: 10px;
    }

    .sync-actions,
    .sync-answers {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sync-actions + .sync-label {
      margin-top: 16px;
    }

    .sync-btn {
      padding: 8px 14px;
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .sync-btn:hover:not(:disabled) {
      color: var(--text-body);
      border-color: var(--text-muted);
    }

    .sync-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .sync-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sync-btn.danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .sync-btn.danger:hover:not(:disabled) {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .sync-question {
      font-size: 14px;
      color: var(--text-body);
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .sync-input {
      display: block;
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 8px;
      background: var(--bg);
      color: var(--text-body);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .sync-input:focus {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>쇼핑 리스트</h1>
      <div class="account">
        <button type="button" class="sync-btn" id="loginBtn">로그인</button>
        <span class="account-email" id="accountEmail" hidden></span>
        <button type="button" class="sync-btn" id="signOutBtn" hidden>로그아웃</button>
      </div>
    </div>

    <div class="status" id="status"></div>

    <div class="panel" id="authPanel" hidden>
      <p class="sync-question">
        로그인하면 클라우드로 기기 사이에서 목록을 옮길 수 있습니다.
        목록은 계정별로 분리되어 다른 사람은 볼 수 없습니다.
      </p>
      <input type="email" class="sync-input" id="emailInput"
             placeholder="이메일" autocomplete="username" spellcheck="false" />
      <input type="password" class="sync-input" id="passwordInput"
             placeholder="비밀번호 (6자 이상)" autocomplete="current-password" />
      <div class="sync-answers">
        <button type="button" class="sync-btn" id="signInBtn">로그인</button>
        <button type="button" class="sync-btn" id="signUpBtn">가입</button>
        <button type="button" class="sync-btn" id="closeAuthBtn">취소</button>
      </div>
    </div>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="아이템을 입력하세요" autocomplete="off" />
      <button type="button" id="addBtn">추가</button>
    </div>

    <div class="stats-row">
      <span class="stats" id="stats"></span>
      <button type="button" class="clear-btn" id="clearBtn" hidden></button>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty">아직 아이템이 없습니다.</div>

    <div class="sync">
      <div id="syncMain">
        <p class="sync-label">파일로 주고받기</p>
        <div class="sync-actions">
          <button type="button" class="sync-btn" id="exportFileBtn">내보내기</button>
          <button type="button" class="sync-btn" id="importFileBtn">가져오기</button>
        </div>

        <p class="sync-label" id="cloudLabel" hidden>클라우드로 주고받기</p>
        <div class="sync-actions" id="cloudActions" hidden>
          <button type="button" class="sync-btn" id="exportCloudBtn">클라우드로 내보내기</button>
          <button type="button" class="sync-btn" id="importCloudBtn">클라우드에서 가져오기</button>
        </div>
      </div>

      <div id="syncConfirm" hidden>
        <p class="sync-question" id="syncQuestion"></p>
        <div class="sync-answers">
          <button type="button" class="sync-btn danger" id="confirmYes">덮어쓰기</button>
          <button type="button" class="sync-btn" id="confirmNo">취소</button>
        </div>
      </div>

      <input type="file" id="fileInput" accept="application/json,.json" hidden />
    </div>
  </div>

  <script>
    // ── 설정 ──────────────────────────────────────────────────────────────
    // 목록은 항상 이 브라우저의 localStorage에만 저장된다. 평소에는 네트워크를 쓰지 않는다.
    // 파일 내보내기/가져오기는 로그인 없이 언제든 되고, 클라우드는 로그인해야 열린다.
    // SDK는 로그인을 시도하거나 이전 세션을 복원할 때만 내려받는다.
    //
    // 아래 키는 publishable 키다. 브라우저 노출을 전제로 만들어진 키이며 공개해도 된다.
    // 접근 통제는 shopping_items의 RLS 정책(authenticated + user_id = auth.uid())이 담당한다.
    // 로그인하지 않은 anon에게는 테이블 권한 자체가 없다. secret 키는 절대 넣지 말 것.
    const SUPABASE_URL = 'https://wyrrluzaadilkdefgidl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2PQmFdbwl_K9b576tvXBXg_6sEzzRJ1';
    const SUPABASE_TABLE = 'shopping_items';
    const SUPABASE_SDK = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    const CLOUD_TIMEOUT_MS = 15000;
    const STORAGE_KEY = 'shoppingList';
    const SIGNED_IN_KEY = 'shoppingListSignedIn';

    const DEFAULT_STATUS = '이 브라우저에 저장됩니다';

    const input = document.getElementById('itemInput');
    const addBtn = document.getElementById('addBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    const statsEl = document.getElementById('stats');
    const emptyEl = document.getElementById('empty');

    const loginBtn = document.getElementById('loginBtn');
    const accountEmail = document.getElementById('accountEmail');
    const signOutBtn = document.getElementById('signOutBtn');
    const authPanel = document.getElementById('authPanel');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const signInBtn = document.getElementById('signInBtn');
    const signUpBtn = document.getElementById('signUpBtn');
    const closeAuthBtn = document.getElementById('closeAuthBtn');

    const syncMain = document.getElementById('syncMain');
    const exportFileBtn = document.getElementById('exportFileBtn');
    const importFileBtn = document.getElementById('importFileBtn');
    const fileInput = document.getElementById('fileInput');
    const cloudLabel = document.getElementById('cloudLabel');
    const cloudActions = document.getElementById('cloudActions');
    const exportCloudBtn = document.getElementById('exportCloudBtn');
    const importCloudBtn = document.getElementById('importCloudBtn');
    const syncConfirm = document.getElementById('syncConfirm');
    const syncQuestion = document.getElementById('syncQuestion');
    const confirmYes = document.getElementById('confirmYes');
    const confirmNo = document.getElementById('confirmNo');

    let items = [];
    let statusTimer = null;

    // ── 저장 ──────────────────────────────────────────────────────────────

    // 이름이 문자열인 것만 받아들이고, id는 순서대로 다시 매겨 중복을 원천 차단한다.
    function normalize(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter((item) => item && typeof item.name === 'string' && item.name.trim())
        .map((item, index) => ({
          id: index + 1,
          name: item.name,
          checked: Boolean(item.checked),
        }));
    }

    function loadItems() {
      try {
        return normalize(JSON.parse(localStorage.getItem(STORAGE_KEY)));
      } catch (e) {
        console.error('저장된 목록을 불러오지 못했습니다:', e);
        return [];
      }
    }

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        // 시크릿 모드처럼 저장이 막힌 환경. 화면은 그대로 두고 사실만 알린다.
        console.error('목록을 저장하지 못했습니다:', e);
        setStatus('목록을 저장하지 못했습니다.', true);
      }
    }

    function replaceItems(list) {
      items = normalize(list);
      saveItems();
      render();
    }

    // ── 상태 표시 ─────────────────────────────────────────────────────────

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', Boolean(isError));
      clearTimeout(statusTimer);
      // 임시 안내는 잠깐 띄웠다가 기본 문구로 돌아간다.
      if (message !== DEFAULT_STATUS) {
        statusTimer = setTimeout(() => setStatus(DEFAULT_STATUS), 5000);
      }
    }

    // ── 목록 조작 ─────────────────────────────────────────────────────────

    function addItem() {
      const name = input.value.trim();
      if (!name) return;
      const id = items.reduce((max, item) => Math.max(max, item.id), 0) + 1;
      items.push({ id, name, checked: false });
      input.value = '';
      saveItems();
      render();
      input.focus();
    }

    function removeItems(ids, refocusInput) {
      items = items.filter((item) => !ids.includes(item.id));
      saveItems();
      render();
      if (refocusInput) input.focus();
    }

    function clearCompleted() {
      const ids = items.filter((item) => item.checked).map((item) => item.id);
      if (ids.length === 0) return;
      // 버튼 자체가 사라지므로 포커스를 입력창으로 옮긴다.
      removeItems(ids, true);
    }

    // ── 이벤트 ────────────────────────────────────────────────────────────

    addBtn.addEventListener('click', addItem);
    clearBtn.addEventListener('click', clearCompleted);

    // 한글 IME에서 조합 중 누른 Enter는 조합을 확정하는 데 쓰인다.
    // macOS는 그 keydown 하나만 오고, Windows는 확정용(keyCode 229)과 실제 Enter가 잇따라 온다.
    // 확정용 Enter를 표시해 두고 keyup에서 한 번만 처리하면 양쪽 모두 정확히 한 번 추가된다.
    let enterCommittedComposition = false;

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (e.isComposing || e.keyCode === 229) {
        enterCommittedComposition = true;
        return;
      }
      enterCommittedComposition = false;
      addItem();
    });

    input.addEventListener('keyup', (e) => {
      if (e.key !== 'Enter' || !enterCommittedComposition) return;
      enterCommittedComposition = false;
      addItem();
    });

    // 체크 토글은 목록을 다시 그리지 않고 해당 항목만 갱신해서 포커스를 유지한다.
    listEl.addEventListener('change', (e) => {
      const checkbox = e.target.closest('.checkbox');
      if (!checkbox) return;
      const li = checkbox.closest('li');
      const item = items.find((i) => i.id === Number(li.dataset.id));
      if (!item) return;
      item.checked = checkbox.checked;
      li.classList.toggle('checked', checkbox.checked);
      saveItems();
      updateStats();
    });

    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = Number(btn.closest('li').dataset.id);
      // 키보드로 삭제하면 포커스가 사라지므로 입력창으로 되돌린다 (detail 0 = 키보드 활성화)
      removeItems([id], e.detail === 0);
    });

    // ── 렌더링 ────────────────────────────────────────────────────────────

    function render() {
      listEl.innerHTML = '';

      items.forEach((item) => {
        const li = document.createElement('li');
        li.dataset.id = item.id;
        if (item.checked) li.classList.add('checked');

        const checkboxId = `item-${item.id}`;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'checkbox';
        checkbox.id = checkboxId;
        checkbox.checked = item.checked;

        // label을 쓰면 이름을 눌러도 체크가 되고, 스크린리더가 항목 이름을 읽어 준다.
        const label = document.createElement('label');
        label.className = 'name';
        label.htmlFor = checkboxId;
        label.textContent = item.name;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.setAttribute('aria-label', `${item.name} 삭제`);

        li.append(checkbox, label, deleteBtn);
        listEl.appendChild(li);
      });

      updateStats();
    }

    function updateStats() {
      const done = items.filter((item) => item.checked).length;
      statsEl.textContent = items.length === 0 ? '' : `총 ${items.length}개 중 ${done}개 완료`;
      emptyEl.style.display = items.length === 0 ? 'block' : 'none';

      // 지울 게 있을 때만 일괄 삭제 버튼을 보여 준다.
      clearBtn.hidden = done === 0;
      clearBtn.textContent = `완료 ${done}개 삭제`;
    }

    // ── 덮어쓰기 확인 ─────────────────────────────────────────────────────

    let pendingSync = null;    // 'exportCloud' | 'importCloud' | 'importFile'
    let pendingItems = null;   // 파일에서 읽어 둔 목록

    function askConfirm(kind, question) {
      pendingSync = kind;
      syncQuestion.textContent = question;
      syncMain.hidden = true;
      syncConfirm.hidden = false;
      confirmYes.focus();
    }

    function closeConfirm() {
      pendingSync = null;
      pendingItems = null;
      syncConfirm.hidden = true;
      syncMain.hidden = false;
    }

    confirmNo.addEventListener('click', () => {
      closeConfirm();
      exportFileBtn.focus();
    });

    confirmYes.addEventListener('click', () => {
      const kind = pendingSync;
      const list = pendingItems;
      closeConfirm();
      if (kind === 'exportCloud') pushToCloud();
      else if (kind === 'importCloud') pullFromCloud();
      else if (kind === 'importFile') {
        replaceItems(list);
        setStatus(`파일에서 ${items.length}개를 가져왔습니다.`);
      }
    });

    // ── 파일로 주고받기 ───────────────────────────────────────────────────

    function exportFile() {
      const payload = {
        app: 'shopping-list',
        version: 1,
        exportedAt: new Date().toISOString(),
        items: items.map((item) => ({ name: item.name, checked: item.checked })),
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `shopping-list-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus(`${items.length}개를 파일로 내보냈습니다.`);
    }

    // 내보낸 형식과 목록만 든 배열 양쪽을 다 받아 준다.
    function parseImported(text) {
      const parsed = JSON.parse(text);
      const list = Array.isArray(parsed) ? parsed : parsed && parsed.items;
      const normalized = normalize(list);
      if (!Array.isArray(list)) throw new Error('목록을 찾을 수 없습니다');
      return normalized;
    }

    exportFileBtn.addEventListener('click', exportFile);

    importFileBtn.addEventListener('click', () => {
      fileInput.value = '';   // 같은 파일을 다시 골라도 change가 오도록 비운다
      fileInput.click();
    });

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      try {
        const list = parseImported(await file.text());
        pendingItems = list;
        askConfirm('importFile', `이 브라우저의 목록을 지우고 파일의 ${list.length}개로 바꿉니다.`);
      } catch (e) {
        console.error('파일을 읽지 못했습니다:', e);
        setStatus('파일을 읽지 못했습니다. 내보내기로 만든 JSON 파일인지 확인해 주세요.', true);
      }
    });

    // ── 클라우드 ──────────────────────────────────────────────────────────

    let supabaseClient = null;   // 로그인하거나 세션을 복원할 때 한 번만 만든다

    // SDK가 window.supabase에 자기를 등록하므로 이 변수를 supabase로 두면 안 된다.
    // 최상위 let 선언이 같은 이름의 전역 프로퍼티 생성을 막아 SDK 로딩이 조용히 실패한다.
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error('SDK를 불러오지 못했습니다'));
        document.head.appendChild(script);
      });
    }

    // 응답 없는 호스트를 만나도 버튼이 영영 잠기지 않도록 제한을 둔다.
    function withTimeout(promise, message) {
      let timer;
      const limit = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), CLOUD_TIMEOUT_MS);
      });
      return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
    }

    async function getClient() {
      if (supabaseClient) return supabaseClient;
      await withTimeout(loadScript(SUPABASE_SDK), 'SDK 로딩 시간이 초과되었습니다');
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return supabaseClient;
    }

    // Supabase가 돌려주는 영문 메시지를 상황에 맞는 한국어로 바꾼다.
    function authMessage(e) {
      const raw = (e && e.message) || '';
      if (/Invalid login credentials/i.test(raw)) return '이메일이나 비밀번호가 맞지 않습니다.';
      if (/Email not confirmed/i.test(raw)) return '메일함의 확인 링크를 먼저 눌러 주세요.';
      if (/already registered/i.test(raw)) return '이미 가입된 이메일입니다. 로그인해 주세요.';
      if (/Password should be at least/i.test(raw)) return '비밀번호는 6자 이상이어야 합니다.';
      if (/valid email/i.test(raw)) return '이메일 형식을 확인해 주세요.';
      if (/rate limit|too many|only request this after/i.test(raw)) return '요청이 너무 잦습니다. 잠시 뒤 다시 시도해 주세요.';
      return '처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.';
    }

    function setAuthBusy(busy) {
      signInBtn.disabled = busy;
      signUpBtn.disabled = busy;
    }

    function setCloudBusy(busy) {
      exportCloudBtn.disabled = busy;
      importCloudBtn.disabled = busy;
    }

    function showSignedIn(user) {
      localStorage.setItem(SIGNED_IN_KEY, '1');
      accountEmail.textContent = user.email;
      accountEmail.hidden = false;
      signOutBtn.hidden = false;
      loginBtn.hidden = true;
      authPanel.hidden = true;
      cloudLabel.hidden = false;
      cloudActions.hidden = false;
      emailInput.value = '';
      passwordInput.value = '';
    }

    function showSignedOut() {
      localStorage.removeItem(SIGNED_IN_KEY);
      accountEmail.hidden = true;
      accountEmail.textContent = '';
      signOutBtn.hidden = true;
      loginBtn.hidden = false;
      cloudLabel.hidden = true;
      cloudActions.hidden = true;
    }

    async function signIn() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        setStatus('이메일과 비밀번호를 모두 입력해 주세요.', true);
        return;
      }
      setAuthBusy(true);
      setStatus('로그인하는 중…');
      try {
        const client = await getClient();
        const { data, error } = await withTimeout(
          client.auth.signInWithPassword({ email, password }), '응답 시간이 초과되었습니다');
        if (error) throw error;
        showSignedIn(data.user);
        setStatus('로그인했습니다.');
      } catch (e) {
        console.error('로그인에 실패했습니다:', e);
        setStatus(authMessage(e), true);
      } finally {
        setAuthBusy(false);
      }
    }

    async function signUp() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        setStatus('이메일과 비밀번호를 모두 입력해 주세요.', true);
        return;
      }
      setAuthBusy(true);
      setStatus('가입하는 중…');
      try {
        const client = await getClient();
        const { data, error } = await withTimeout(
          client.auth.signUp({ email, password }), '응답 시간이 초과되었습니다');
        if (error) throw error;

        if (data.session) {
          // 확인 메일이 꺼져 있는 프로젝트에서는 가입 즉시 로그인된다.
          showSignedIn(data.user);
          setStatus('가입하고 로그인했습니다.');
        } else {
          passwordInput.value = '';
          setStatus('확인 메일을 보냈습니다. 링크를 누른 뒤 로그인해 주세요.');
        }
      } catch (e) {
        console.error('가입에 실패했습니다:', e);
        setStatus(authMessage(e), true);
      } finally {
        setAuthBusy(false);
      }
    }

    async function signOut() {
      signOutBtn.disabled = true;
      try {
        const client = await getClient();
        await withTimeout(client.auth.signOut(), '응답 시간이 초과되었습니다');
      } catch (e) {
        console.error('로그아웃에 실패했습니다:', e);
      } finally {
        signOutBtn.disabled = false;
        showSignedOut();
        setStatus('로그아웃했습니다. 목록은 그대로 남아 있습니다.');
      }
    }

    async function pushToCloud() {
      setCloudBusy(true);
      setStatus('클라우드로 내보내는 중…');
      try {
        const client = await getClient();

        // 지우기 전에 넣는다. 중간에 실패하면 중복이 남을 뿐, 목록이 사라지지는 않는다.
        // user_id는 컬럼 기본값 auth.uid()가 채우므로 따로 보내지 않는다.
        const { data: existing, error: readError } = await withTimeout(
          client.from(SUPABASE_TABLE).select('id'),
          '클라우드 응답 시간이 초과되었습니다'
        );
        if (readError) throw readError;

        if (items.length > 0) {
          const rows = items.map((item) => ({ name: item.name, checked: item.checked }));
          const { error: insertError } = await withTimeout(
            client.from(SUPABASE_TABLE).insert(rows),
            '클라우드 응답 시간이 초과되었습니다'
          );
          if (insertError) throw insertError;
        }

        const oldIds = existing.map((row) => row.id);
        if (oldIds.length > 0) {
          const { error: deleteError } = await withTimeout(
            client.from(SUPABASE_TABLE).delete().in('id', oldIds),
            '클라우드 응답 시간이 초과되었습니다'
          );
          if (deleteError) throw deleteError;
        }

        setStatus(`클라우드에 ${items.length}개를 내보냈습니다.`);
      } catch (e) {
        console.error('내보내기에 실패했습니다:', e);
        setStatus('내보내지 못했습니다. 로그인 상태와 연결을 확인해 주세요.', true);
      } finally {
        setCloudBusy(false);
      }
    }

    async function pullFromCloud() {
      setCloudBusy(true);
      setStatus('클라우드에서 가져오는 중…');
      try {
        const client = await getClient();

        // 넣은 순서대로 보여 주려고 id로 정렬한다. 한 번에 넣은 행들은 created_at이 모두 같다.
        const { data, error } = await withTimeout(
          client.from(SUPABASE_TABLE).select('*').order('id', { ascending: true }),
          '클라우드 응답 시간이 초과되었습니다'
        );
        if (error) throw error;

        replaceItems(data);
        setStatus(`클라우드에서 ${items.length}개를 가져왔습니다.`);
      } catch (e) {
        console.error('가져오기에 실패했습니다:', e);
        setStatus('가져오지 못했습니다. 로그인 상태와 연결을 확인해 주세요.', true);
      } finally {
        setCloudBusy(false);
      }
    }

    loginBtn.addEventListener('click', () => {
      authPanel.hidden = false;
      emailInput.focus();
    });

    closeAuthBtn.addEventListener('click', () => {
      emailInput.value = '';
      passwordInput.value = '';
      authPanel.hidden = true;
      loginBtn.focus();
    });

    signInBtn.addEventListener('click', signIn);
    signUpBtn.addEventListener('click', signUp);
    signOutBtn.addEventListener('click', signOut);

    // 비밀번호 칸에서 Enter를 누르면 로그인으로 잇는다.
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) signIn();
    });

    exportCloudBtn.addEventListener('click', () =>
      askConfirm('exportCloud', `클라우드의 기존 목록을 지우고 지금 목록 ${items.length}개로 덮어씁니다.`));

    importCloudBtn.addEventListener('click', () =>
      askConfirm('importCloud', '이 브라우저의 목록을 지우고 클라우드 목록으로 바꿉니다.'));

    // ── 시작 ──────────────────────────────────────────────────────────────

    // 이전에 로그인한 적이 있을 때만 SDK를 받아 세션을 되살린다.
    // 로그인한 적 없는 방문자에게는 네트워크 요청이 한 건도 나가지 않는다.
    async function restoreSession() {
      try {
        const client = await getClient();
        const { data } = await withTimeout(client.auth.getSession(), '응답 시간이 초과되었습니다');
        if (data.session) showSignedIn(data.session.user);
        else showSignedOut();
      } catch (e) {
        console.error('세션을 확인하지 못했습니다:', e);
        showSignedOut();
        setStatus('로그인 상태를 확인하지 못했습니다. 다시 로그인해 주세요.', true);
      }
    }

    items = loadItems();
    render();
    setStatus(DEFAULT_STATUS);
    showSignedOut();
    input.focus();

    if (localStorage.getItem(SIGNED_IN_KEY) === '1') restoreSession();
  </script>
</body>
</html>
