<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-body: #333333;
      --text-muted: #888888;
      --text-faint: #aaaaaa;
      --border: #dddddd;
      --accent: #4361ee;
      --accent-hover: #3a56d4;
      --danger: #e74c3c;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --card: #21242b;
        --text: #e8eaed;
        --text-body: #d5d8dd;
        --text-muted: #8b8f99;
        --text-faint: #6b7080;
        --border: #3a3f4b;
        --accent: #6b83f5;
        --accent-hover: #8093f7;
        --danger: #ff6b5b;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* display를 지정한 요소는 hidden 속성만으로 숨겨지지 않으므로 여기서 확실히 눌러 준다 */
    [hidden] { display: none !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 28px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .status {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
      min-height: 18px;
    }

    .status.error {
      color: var(--danger);
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      background: var(--card);
      color: var(--text-body);
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: var(--accent);
    }

    .input-row button {
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: var(--accent-hover);
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      min-height: 22px;
    }

    .stats {
      font-size: 14px;
      color: var(--text-muted);
    }

    .clear-btn {
      background: none;
      border: none;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .clear-btn:hover {
      color: var(--danger);
    }

    .clear-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      transition: opacity 0.2s;
    }

    li.checked {
      opacity: 0.55;
    }

    /* 기본 체크박스의 모양만 덮어써서 키보드·스크린리더 지원은 그대로 살린다 */
    li .checkbox {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    li .checkbox:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    li .checkbox:checked::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 45%;
      width: 5px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    li .checkbox:focus-visible,
    li .delete-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    li .name {
      flex: 1;
      font-size: 16px;
      color: var(--text-body);
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    li.checked .name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    li .delete-btn {
      background: none;
      border: none;
      border-radius: 4px;
      color: var(--text-faint);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    li .delete-btn:hover {
      color: var(--danger);
    }

    .empty {
      text-align: center;
      color: var(--text-faint);
      padding: 40px 0;
      font-size: 15px;
    }

    .sync {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .sync-actions,
    .sync-answers {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sync-btn {
      padding: 8px 14px;
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .sync-btn:hover:not(:disabled) {
      color: var(--text-body);
      border-color: var(--text-muted);
    }

    .sync-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .sync-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sync-btn.danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .sync-btn.danger:hover:not(:disabled) {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .sync-question {
      font-size: 14px;
      color: var(--text-body);
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .sync-input {
      display: block;
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 8px;
      background: var(--card);
      color: var(--text-body);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .sync-input:focus {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>쇼핑 리스트</h1>
    <div class="status" id="status"></div>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="아이템을 입력하세요" autocomplete="off" />
      <button type="button" id="addBtn">추가</button>
    </div>

    <div class="stats-row">
      <span class="stats" id="stats"></span>
      <button type="button" class="clear-btn" id="clearBtn" hidden></button>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty">아직 아이템이 없습니다.</div>

    <div class="sync">
      <div class="sync-actions" id="setupActions">
        <button type="button" class="sync-btn" id="setupBtn">클라우드 연결 설정</button>
      </div>

      <div id="setupForm" hidden>
        <p class="sync-question">
          Supabase 프로젝트 URL과 publishable(anon) 키를 넣으면 기기 간에 목록을 옮길 수 있습니다.
          입력한 값은 이 브라우저에만 저장되며 어디로도 전송되지 않습니다.
        </p>
        <input type="text" class="sync-input" id="urlInput"
               placeholder="https://xxxxxxxx.supabase.co" autocomplete="off" spellcheck="false" />
        <input type="text" class="sync-input" id="keyInput"
               placeholder="sb_publishable_... (secret 키가 아닌 공개용 키)" autocomplete="off" spellcheck="false" />
        <div class="sync-answers">
          <button type="button" class="sync-btn" id="setupSave">연결</button>
          <button type="button" class="sync-btn" id="setupCancel">취소</button>
        </div>
      </div>

      <div class="sync-actions" id="syncActions" hidden>
        <button type="button" class="sync-btn" id="exportBtn">클라우드로 내보내기</button>
        <button type="button" class="sync-btn" id="importBtn">클라우드에서 가져오기</button>
        <button type="button" class="sync-btn" id="disconnectBtn">연결 해제</button>
      </div>

      <div id="syncConfirm" hidden>
        <p class="sync-question" id="syncQuestion"></p>
        <div class="sync-answers">
          <button type="button" class="sync-btn danger" id="confirmYes">덮어쓰기</button>
          <button type="button" class="sync-btn" id="confirmNo">취소</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── 설정 ──────────────────────────────────────────────────────────────
    // 목록은 항상 이 브라우저의 localStorage에만 저장된다. 평소에는 네트워크를 쓰지 않는다.
    //
    // 클라우드 연결 정보는 이 파일에 넣지 않는다. 이 페이지는 공개 URL로 서비스되므로
    // 키를 박아 두면 누구나 목록을 읽거나 덮어쓸 수 있기 때문이다.
    // 대신 화면 아래 '클라우드 연결 설정'에서 각자 넣고, 그 브라우저에만 저장한다.
    // 직접 호스팅하면서 값을 고정하고 싶다면 아래 두 상수를 채우면 된다(공개 배포에는 권장하지 않음).
    const SUPABASE_URL = '';
    const SUPABASE_ANON_KEY = '';
    const SUPABASE_TABLE = 'shopping_items';
    const SUPABASE_SDK = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    const CLOUD_TIMEOUT_MS = 10000;
    const STORAGE_KEY = 'shoppingList';
    const CLOUD_KEY = 'shoppingListCloud';

    const DEFAULT_STATUS = '이 브라우저에 저장됩니다';

    const input = document.getElementById('itemInput');
    const addBtn = document.getElementById('addBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    const statsEl = document.getElementById('stats');
    const emptyEl = document.getElementById('empty');
    const setupActions = document.getElementById('setupActions');
    const setupBtn = document.getElementById('setupBtn');
    const setupForm = document.getElementById('setupForm');
    const urlInput = document.getElementById('urlInput');
    const keyInput = document.getElementById('keyInput');
    const setupSave = document.getElementById('setupSave');
    const setupCancel = document.getElementById('setupCancel');
    const syncActions = document.getElementById('syncActions');
    const syncConfirm = document.getElementById('syncConfirm');
    const syncQuestion = document.getElementById('syncQuestion');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const confirmYes = document.getElementById('confirmYes');
    const confirmNo = document.getElementById('confirmNo');

    let items = [];
    let statusTimer = null;

    // ── 저장 ──────────────────────────────────────────────────────────────

    function loadItems() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!Array.isArray(saved)) return [];
        return saved
          .filter((item) => item && typeof item.name === 'string')
          .map((item, index) => ({
            id: index + 1,
            name: item.name,
            checked: Boolean(item.checked),
          }));
      } catch (e) {
        console.error('저장된 목록을 불러오지 못했습니다:', e);
        return [];
      }
    }

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        // 시크릿 모드처럼 저장이 막힌 환경. 화면은 그대로 두고 사실만 알린다.
        console.error('목록을 저장하지 못했습니다:', e);
        setStatus('목록을 저장하지 못했습니다.', true);
      }
    }

    // ── 상태 표시 ─────────────────────────────────────────────────────────

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', Boolean(isError));
      clearTimeout(statusTimer);
      // 임시 안내는 잠깐 띄웠다가 기본 문구로 돌아간다.
      if (message !== DEFAULT_STATUS) {
        statusTimer = setTimeout(() => setStatus(DEFAULT_STATUS), 5000);
      }
    }

    // ── 목록 조작 ─────────────────────────────────────────────────────────

    function addItem() {
      const name = input.value.trim();
      if (!name) return;
      const id = items.reduce((max, item) => Math.max(max, item.id), 0) + 1;
      items.push({ id, name, checked: false });
      input.value = '';
      saveItems();
      render();
      input.focus();
    }

    function removeItems(ids, refocusInput) {
      items = items.filter((item) => !ids.includes(item.id));
      saveItems();
      render();
      if (refocusInput) input.focus();
    }

    function clearCompleted() {
      const ids = items.filter((item) => item.checked).map((item) => item.id);
      if (ids.length === 0) return;
      // 버튼 자체가 사라지므로 포커스를 입력창으로 옮긴다.
      removeItems(ids, true);
    }

    // ── 이벤트 ────────────────────────────────────────────────────────────

    addBtn.addEventListener('click', addItem);
    clearBtn.addEventListener('click', clearCompleted);

    // 한글 IME에서 조합 중 누른 Enter는 조합을 확정하는 데 쓰인다.
    // macOS는 그 keydown 하나만 오고, Windows는 확정용(keyCode 229)과 실제 Enter가 잇따라 온다.
    // 확정용 Enter를 표시해 두고 keyup에서 한 번만 처리하면 양쪽 모두 정확히 한 번 추가된다.
    let enterCommittedComposition = false;

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (e.isComposing || e.keyCode === 229) {
        enterCommittedComposition = true;
        return;
      }
      enterCommittedComposition = false;
      addItem();
    });

    input.addEventListener('keyup', (e) => {
      if (e.key !== 'Enter' || !enterCommittedComposition) return;
      enterCommittedComposition = false;
      addItem();
    });

    // 체크 토글은 목록을 다시 그리지 않고 해당 항목만 갱신해서 포커스를 유지한다.
    listEl.addEventListener('change', (e) => {
      const checkbox = e.target.closest('.checkbox');
      if (!checkbox) return;
      const li = checkbox.closest('li');
      const item = items.find((i) => i.id === Number(li.dataset.id));
      if (!item) return;
      item.checked = checkbox.checked;
      li.classList.toggle('checked', checkbox.checked);
      saveItems();
      updateStats();
    });

    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = Number(btn.closest('li').dataset.id);
      // 키보드로 삭제하면 포커스가 사라지므로 입력창으로 되돌린다 (detail 0 = 키보드 활성화)
      removeItems([id], e.detail === 0);
    });

    // ── 렌더링 ────────────────────────────────────────────────────────────

    function render() {
      listEl.innerHTML = '';

      items.forEach((item) => {
        const li = document.createElement('li');
        li.dataset.id = item.id;
        if (item.checked) li.classList.add('checked');

        const checkboxId = `item-${item.id}`;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'checkbox';
        checkbox.id = checkboxId;
        checkbox.checked = item.checked;

        // label을 쓰면 이름을 눌러도 체크가 되고, 스크린리더가 항목 이름을 읽어 준다.
        const label = document.createElement('label');
        label.className = 'name';
        label.htmlFor = checkboxId;
        label.textContent = item.name;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.setAttribute('aria-label', `${item.name} 삭제`);

        li.append(checkbox, label, deleteBtn);
        listEl.appendChild(li);
      });

      updateStats();
    }

    function updateStats() {
      const done = items.filter((item) => item.checked).length;
      statsEl.textContent = items.length === 0 ? '' : `총 ${items.length}개 중 ${done}개 완료`;
      emptyEl.style.display = items.length === 0 ? 'block' : 'none';

      // 지울 게 있을 때만 일괄 삭제 버튼을 보여 준다.
      clearBtn.hidden = done === 0;
      clearBtn.textContent = `완료 ${done}개 삭제`;
    }

    // ── 클라우드 내보내기 / 가져오기 ──────────────────────────────────────

    let supabaseClient = null;   // 첫 동기화 때 한 번만 만든다
    let pendingSync = null;      // 'export' | 'import'
    let cloudConfig = null;      // { url, key } 또는 null

    // 연결 정보는 이 브라우저에만 둔다. 파일에 상수를 채워 뒀다면 그것을 기본값으로 쓴다.
    function loadCloudConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(CLOUD_KEY));
        if (saved && typeof saved.url === 'string' && typeof saved.key === 'string'
            && saved.url.trim() && saved.key.trim()) {
          return { url: saved.url.trim(), key: saved.key.trim() };
        }
      } catch (e) {
        console.error('클라우드 설정을 읽지 못했습니다:', e);
      }
      if (SUPABASE_URL.trim() && SUPABASE_ANON_KEY.trim()) {
        return { url: SUPABASE_URL.trim(), key: SUPABASE_ANON_KEY.trim() };
      }
      return null;
    }

    // 'setup' | 'form' | 'ready' | 'confirm' 중 하나만 보여 준다.
    function showSyncState(state) {
      setupActions.hidden = state !== 'setup';
      setupForm.hidden = state !== 'form';
      syncActions.hidden = state !== 'ready';
      syncConfirm.hidden = state !== 'confirm';
    }

    // SDK는 버튼을 처음 누를 때만 내려받는다. 그전까지는 네트워크 요청이 없다.
    // SDK가 window.supabase에 자기를 등록하므로 위 클라이언트 변수를 supabase로 두면 안 된다.
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error('SDK를 불러오지 못했습니다'));
        document.head.appendChild(script);
      });
    }

    // 응답 없는 호스트를 만나도 버튼이 영영 잠기지 않도록 제한을 둔다.
    function withTimeout(promise, message) {
      let timer;
      const limit = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), CLOUD_TIMEOUT_MS);
      });
      return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
    }

    async function getClient() {
      if (!cloudConfig) throw new Error('클라우드 연결 정보가 없습니다');
      if (supabaseClient) return supabaseClient;
      await withTimeout(loadScript(SUPABASE_SDK), 'SDK 로딩 시간이 초과되었습니다');
      supabaseClient = window.supabase.createClient(cloudConfig.url, cloudConfig.key);
      return supabaseClient;
    }

    function setSyncBusy(busy) {
      exportBtn.disabled = busy;
      importBtn.disabled = busy;
      disconnectBtn.disabled = busy;
    }

    function askConfirm(kind) {
      pendingSync = kind;
      syncQuestion.textContent = kind === 'export'
        ? `클라우드의 기존 목록을 지우고 지금 목록 ${items.length}개로 덮어씁니다.`
        : '이 브라우저의 목록을 지우고 클라우드 목록으로 바꿉니다.';
      showSyncState('confirm');
      confirmYes.focus();
    }

    function closeConfirm() {
      pendingSync = null;
      showSyncState('ready');
    }

    async function pushToCloud() {
      setSyncBusy(true);
      setStatus('클라우드로 내보내는 중…');
      try {
        const client = await getClient();

        // 지우기 전에 넣는다. 중간에 실패하면 중복이 남을 뿐, 목록이 사라지지는 않는다.
        const { data: existing, error: readError } = await withTimeout(
          client.from(SUPABASE_TABLE).select('id'),
          '클라우드 응답 시간이 초과되었습니다'
        );
        if (readError) throw readError;

        if (items.length > 0) {
          const rows = items.map((item) => ({ name: item.name, checked: item.checked }));
          const { error: insertError } = await withTimeout(
            client.from(SUPABASE_TABLE).insert(rows),
            '클라우드 응답 시간이 초과되었습니다'
          );
          if (insertError) throw insertError;
        }

        const oldIds = existing.map((row) => row.id);
        if (oldIds.length > 0) {
          const { error: deleteError } = await withTimeout(
            client.from(SUPABASE_TABLE).delete().in('id', oldIds),
            '클라우드 응답 시간이 초과되었습니다'
          );
          if (deleteError) throw deleteError;
        }

        setStatus(`클라우드에 ${items.length}개를 내보냈습니다.`);
      } catch (e) {
        console.error('내보내기에 실패했습니다:', e);
        setStatus('내보내지 못했습니다. 연결을 확인해 주세요.', true);
      } finally {
        setSyncBusy(false);
      }
    }

    async function pullFromCloud() {
      setSyncBusy(true);
      setStatus('클라우드에서 가져오는 중…');
      try {
        const client = await getClient();

        // 넣은 순서대로 보여 주려고 id로 정렬한다. 한 번에 넣은 행들은 created_at이 모두 같다.
        const { data, error } = await withTimeout(
          client.from(SUPABASE_TABLE).select('*').order('id', { ascending: true }),
          '클라우드 응답 시간이 초과되었습니다'
        );
        if (error) throw error;

        items = data
          .filter((row) => row && typeof row.name === 'string')
          .map((row, index) => ({
            id: index + 1,
            name: row.name,
            checked: Boolean(row.checked),
          }));
        saveItems();
        render();
        setStatus(`클라우드에서 ${items.length}개를 가져왔습니다.`);
      } catch (e) {
        console.error('가져오기에 실패했습니다:', e);
        setStatus('가져오지 못했습니다. 연결을 확인해 주세요.', true);
      } finally {
        setSyncBusy(false);
      }
    }

    // ── 연결 설정 ─────────────────────────────────────────────────────────

    // 값을 저장하기 전에 실제로 조회가 되는지 확인한다. 잘못된 설정이 조용히 남지 않도록.
    async function connectCloud(url, key) {
      setupSave.disabled = true;
      setStatus('연결을 확인하는 중…');
      try {
        cloudConfig = { url, key };
        supabaseClient = null;

        const client = await getClient();
        const { error } = await withTimeout(
          client.from(SUPABASE_TABLE).select('id').limit(1),
          '클라우드 응답 시간이 초과되었습니다'
        );
        if (error) throw error;

        localStorage.setItem(CLOUD_KEY, JSON.stringify(cloudConfig));
        urlInput.value = '';
        keyInput.value = '';
        showSyncState('ready');
        setStatus('클라우드에 연결했습니다.');
      } catch (e) {
        console.error('연결에 실패했습니다:', e);
        cloudConfig = null;
        supabaseClient = null;
        setStatus('연결하지 못했습니다. 주소와 키, 테이블을 확인해 주세요.', true);
      } finally {
        setupSave.disabled = false;
      }
    }

    setupBtn.addEventListener('click', () => {
      showSyncState('form');
      urlInput.focus();
    });

    setupCancel.addEventListener('click', () => {
      urlInput.value = '';
      keyInput.value = '';
      showSyncState('setup');
      setupBtn.focus();
    });

    setupSave.addEventListener('click', () => {
      const url = urlInput.value.trim();
      const key = keyInput.value.trim();
      if (!url || !key) {
        setStatus('주소와 키를 모두 입력해 주세요.', true);
        return;
      }
      if (!/^https:\/\/[^\s/]+/.test(url)) {
        setStatus('주소는 https://로 시작하는 프로젝트 URL이어야 합니다.', true);
        return;
      }
      connectCloud(url, key);
    });

    disconnectBtn.addEventListener('click', () => {
      cloudConfig = null;
      supabaseClient = null;
      localStorage.removeItem(CLOUD_KEY);
      showSyncState('setup');
      setupBtn.focus();
      setStatus('클라우드 연결을 해제했습니다. 목록은 그대로 남아 있습니다.');
    });

    exportBtn.addEventListener('click', () => askConfirm('export'));
    importBtn.addEventListener('click', () => askConfirm('import'));
    confirmNo.addEventListener('click', () => {
      closeConfirm();
      exportBtn.focus();
    });
    confirmYes.addEventListener('click', () => {
      const kind = pendingSync;
      closeConfirm();
      if (kind === 'export') pushToCloud();
      else if (kind === 'import') pullFromCloud();
    });

    // ── 시작 ──────────────────────────────────────────────────────────────

    items = loadItems();
    render();
    setStatus(DEFAULT_STATUS);
    cloudConfig = loadCloudConfig();
    showSyncState(cloudConfig ? 'ready' : 'setup');
    input.focus();
  </script>
</body>
</html>
