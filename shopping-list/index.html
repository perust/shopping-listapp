<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-body: #333333;
      --text-muted: #888888;
      --text-faint: #aaaaaa;
      --border: #dddddd;
      --accent: #4361ee;
      --accent-hover: #3a56d4;
      --accent-soft: rgba(67, 97, 238, 0.08);
      --danger: #e74c3c;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --card: #21242b;
        --text: #e8eaed;
        --text-body: #d5d8dd;
        --text-muted: #8b8f99;
        --text-faint: #6b7080;
        --border: #3a3f4b;
        --accent: #6b83f5;
        --accent-hover: #8093f7;
        --accent-soft: rgba(107, 131, 245, 0.12);
        --danger: #ff6b5b;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* display를 지정한 요소는 hidden 속성만으로 숨겨지지 않으므로 여기서 확실히 눌러 준다 */
    [hidden] { display: none !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      color: var(--text);
    }

    /* 저장 위치를 한눈에 알리는 상시 라벨. 일시적인 안내는 아래 .status가 맡는다. */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .status {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
      min-height: 18px;
    }

    .status.error {
      color: var(--danger);
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      background: var(--card);
      color: var(--text-body);
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: var(--accent);
    }

    .input-row button {
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: var(--accent-hover);
    }

    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      min-height: 22px;
    }

    .stats {
      font-size: 14px;
      color: var(--text-muted);
    }

    .clear-btn {
      background: none;
      border: none;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .clear-btn:hover {
      color: var(--danger);
    }

    .clear-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      transition: opacity 0.2s;
    }

    li.checked {
      opacity: 0.55;
    }

    /* 기본 체크박스의 모양만 덮어써서 키보드·스크린리더 지원은 그대로 살린다 */
    li .checkbox {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    li .checkbox:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    li .checkbox:checked::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 45%;
      width: 5px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    li .checkbox:focus-visible,
    li .delete-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    li .name {
      flex: 1;
      font-size: 16px;
      color: var(--text-body);
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    li.checked .name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    li .delete-btn {
      background: none;
      border: none;
      border-radius: 4px;
      color: var(--text-faint);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    li .delete-btn:hover {
      color: var(--danger);
    }

    .empty {
      text-align: center;
      color: var(--text-faint);
      padding: 40px 0;
      font-size: 15px;
    }

    .sync {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .sync-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sync-btn {
      padding: 8px 14px;
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .sync-btn:hover:not(:disabled) {
      color: var(--text-body);
      border-color: var(--text-muted);
    }

    .sync-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .sync-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sync-btn.danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .sync-btn.danger:hover:not(:disabled) {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .sync-question {
      font-size: 14px;
      color: var(--text-body);
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .sync-hint {
      font-size: 13px;
      color: var(--text-faint);
      margin-top: 10px;
      line-height: 1.5;
    }

    .sync-input {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--card);
      color: var(--text-body);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      outline: none;
      transition: border-color 0.2s;
    }

    .sync-input:focus {
      border-color: var(--accent);
    }

    .banner {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .banner-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-body);
      margin-bottom: 10px;
    }

    .banner-remaining {
      font-weight: 400;
      color: var(--text-muted);
    }

    .code-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .code {
      flex: 1;
      min-width: 150px;
      padding: 8px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 17px;
      letter-spacing: 0.12em;
      color: var(--text);
      text-align: center;
      user-select: all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>쇼핑 리스트</h1>
      <span class="badge">로컬 저장중</span>
    </div>
    <div class="status" id="status"></div>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="아이템을 입력하세요" autocomplete="off" />
      <button type="button" id="addBtn">추가</button>
    </div>

    <div class="stats-row">
      <span class="stats" id="stats"></span>
      <button type="button" class="clear-btn" id="clearBtn" hidden></button>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty">아직 아이템이 없습니다.</div>

    <div class="sync">
      <div id="syncMain">
        <div class="banner" id="transferBanner" hidden>
          <p class="banner-title">
            클라우드 내보내기 상태입니다
            <span class="banner-remaining" id="transferRemaining"></span>
          </p>
          <div class="code-row">
            <span class="code" id="transferCode"></span>
            <button type="button" class="sync-btn" id="copyCodeBtn">코드 복사</button>
          </div>
          <p class="sync-hint">
            다른 기기에서 <b>가져오기 → 클라우드에서</b>를 눌러 이 코드를 붙여넣으세요.
            가져오는 순간 클라우드에서 사라지고, 24시간이 지나도 사라집니다.
          </p>
        </div>

        <div class="sync-actions">
          <button type="button" class="sync-btn" id="exportBtn">내보내기</button>
          <button type="button" class="sync-btn" id="importBtn">가져오기</button>
        </div>
      </div>

      <div id="exportMenu" hidden>
        <p class="sync-question">어디로 내보낼까요?</p>
        <div class="sync-actions">
          <button type="button" class="sync-btn" id="exportFileBtn">파일로</button>
          <button type="button" class="sync-btn" id="exportCloudBtn">클라우드로</button>
          <button type="button" class="sync-btn" id="exportCancelBtn">취소</button>
        </div>
        <p class="sync-hint">
          파일은 JSON으로 저장하고, 클라우드는 24시간짜리 백업 코드를 만듭니다.
        </p>
      </div>

      <div id="importMenu" hidden>
        <p class="sync-question">어디서 가져올까요?</p>
        <div class="sync-actions">
          <button type="button" class="sync-btn" id="importFileBtn">파일에서</button>
          <button type="button" class="sync-btn" id="importCloudBtn">클라우드에서</button>
          <button type="button" class="sync-btn" id="importCancelBtn">취소</button>
        </div>
      </div>

      <div id="codeInput" hidden>
        <p class="sync-question">받은 백업 코드를 붙여넣으세요.</p>
        <input type="text" class="sync-input" id="codeField"
               placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" />
        <div class="sync-actions">
          <button type="button" class="sync-btn" id="codeSubmitBtn">가져오기</button>
          <button type="button" class="sync-btn" id="codeCancelBtn">취소</button>
        </div>
        <p class="sync-hint">가져오면 클라우드에서는 지워집니다. 한 번만 쓸 수 있습니다.</p>
      </div>

      <div id="syncConfirm" hidden>
        <p class="sync-question" id="syncQuestion"></p>
        <div class="sync-actions">
          <button type="button" class="sync-btn danger" id="confirmYes">덮어쓰기</button>
          <button type="button" class="sync-btn" id="confirmNo">취소</button>
        </div>
      </div>

      <input type="file" id="fileInput" accept="application/json,.json" hidden />
    </div>
  </div>

  <script>
    // ── 설정 ──────────────────────────────────────────────────────────────
    // 목록은 항상 이 브라우저의 localStorage에만 저장된다. 평소에는 네트워크를 쓰지 않는다.
    //
    // 클라우드는 저장소가 아니라 1회성 전송함이다. 내보내면 백업 코드가 나오고,
    // 다른 기기에서 그 코드로 가져가면 서버에서 즉시 지워진다. 24시간이 지나도 지워진다.
    //
    // 아래 키는 publishable 키다. 브라우저 노출을 전제로 만들어진 공개용 키다.
    // transfers 테이블은 anon 권한을 모두 회수해 두어 직접 조회가 불가능하고,
    // 코드를 인자로 받는 함수 세 개로만 접근한다. 즉 코드를 모르면 아무것도 할 수 없다.
    const SUPABASE_URL = 'https://wyrrluzaadilkdefgidl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2PQmFdbwl_K9b576tvXBXg_6sEzzRJ1';
    const CLOUD_TIMEOUT_MS = 15000;
    const STORAGE_KEY = 'shoppingList';
    const TRANSFER_KEY = 'shoppingListTransfer';

    // 저장 위치는 우상단 '로컬 저장중' 라벨이 상시로 알리므로, 이 줄은 일시 안내에만 쓴다.
    const DEFAULT_STATUS = '';

    const input = document.getElementById('itemInput');
    const addBtn = document.getElementById('addBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    const statsEl = document.getElementById('stats');
    const emptyEl = document.getElementById('empty');

    const syncMain = document.getElementById('syncMain');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const exportMenu = document.getElementById('exportMenu');
    const exportFileBtn = document.getElementById('exportFileBtn');
    const exportCloudBtn = document.getElementById('exportCloudBtn');
    const exportCancelBtn = document.getElementById('exportCancelBtn');
    const importMenu = document.getElementById('importMenu');
    const importFileBtn = document.getElementById('importFileBtn');
    const importCloudBtn = document.getElementById('importCloudBtn');
    const importCancelBtn = document.getElementById('importCancelBtn');
    const codeInput = document.getElementById('codeInput');
    const codeField = document.getElementById('codeField');
    const codeSubmitBtn = document.getElementById('codeSubmitBtn');
    const codeCancelBtn = document.getElementById('codeCancelBtn');
    const syncConfirm = document.getElementById('syncConfirm');
    const syncQuestion = document.getElementById('syncQuestion');
    const confirmYes = document.getElementById('confirmYes');
    const confirmNo = document.getElementById('confirmNo');
    const fileInput = document.getElementById('fileInput');

    const transferBanner = document.getElementById('transferBanner');
    const transferRemaining = document.getElementById('transferRemaining');
    const transferCode = document.getElementById('transferCode');
    const copyCodeBtn = document.getElementById('copyCodeBtn');

    let items = [];
    let statusTimer = null;

    // ── 저장 ──────────────────────────────────────────────────────────────

    // 이름이 문자열인 것만 받아들이고, id는 순서대로 다시 매겨 중복을 원천 차단한다.
    function normalize(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter((item) => item && typeof item.name === 'string' && item.name.trim())
        .map((item, index) => ({
          id: index + 1,
          name: item.name,
          checked: Boolean(item.checked),
        }));
    }

    function loadItems() {
      try {
        return normalize(JSON.parse(localStorage.getItem(STORAGE_KEY)));
      } catch (e) {
        console.error('저장된 목록을 불러오지 못했습니다:', e);
        return [];
      }
    }

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        // 시크릿 모드처럼 저장이 막힌 환경. 화면은 그대로 두고 사실만 알린다.
        console.error('목록을 저장하지 못했습니다:', e);
        setStatus('목록을 저장하지 못했습니다.', true);
      }
    }

    function replaceItems(list) {
      items = normalize(list);
      saveItems();
      render();
    }

    // ── 상태 표시 ─────────────────────────────────────────────────────────

    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', Boolean(isError));
      clearTimeout(statusTimer);
      // 임시 안내는 잠깐 띄웠다가 기본 문구로 돌아간다.
      if (message !== DEFAULT_STATUS) {
        statusTimer = setTimeout(() => setStatus(DEFAULT_STATUS), 5000);
      }
    }

    // ── 목록 조작 ─────────────────────────────────────────────────────────

    function addItem() {
      const name = input.value.trim();
      if (!name) return;
      const id = items.reduce((max, item) => Math.max(max, item.id), 0) + 1;
      items.push({ id, name, checked: false });
      input.value = '';
      saveItems();
      render();
      input.focus();
    }

    function removeItems(ids, refocusInput) {
      items = items.filter((item) => !ids.includes(item.id));
      saveItems();
      render();
      if (refocusInput) input.focus();
    }

    function clearCompleted() {
      const ids = items.filter((item) => item.checked).map((item) => item.id);
      if (ids.length === 0) return;
      // 버튼 자체가 사라지므로 포커스를 입력창으로 옮긴다.
      removeItems(ids, true);
    }

    // ── 이벤트 ────────────────────────────────────────────────────────────

    addBtn.addEventListener('click', addItem);
    clearBtn.addEventListener('click', clearCompleted);

    // 한글 IME에서 조합 중 누른 Enter는 조합을 확정하는 데 쓰인다.
    // macOS는 그 keydown 하나만 오고, Windows는 확정용(keyCode 229)과 실제 Enter가 잇따라 온다.
    // 확정용 Enter를 표시해 두고 keyup에서 한 번만 처리하면 양쪽 모두 정확히 한 번 추가된다.
    let enterCommittedComposition = false;

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (e.isComposing || e.keyCode === 229) {
        enterCommittedComposition = true;
        return;
      }
      enterCommittedComposition = false;
      addItem();
    });

    input.addEventListener('keyup', (e) => {
      if (e.key !== 'Enter' || !enterCommittedComposition) return;
      enterCommittedComposition = false;
      addItem();
    });

    // 체크 토글은 목록을 다시 그리지 않고 해당 항목만 갱신해서 포커스를 유지한다.
    listEl.addEventListener('change', (e) => {
      const checkbox = e.target.closest('.checkbox');
      if (!checkbox) return;
      const li = checkbox.closest('li');
      const item = items.find((i) => i.id === Number(li.dataset.id));
      if (!item) return;
      item.checked = checkbox.checked;
      li.classList.toggle('checked', checkbox.checked);
      saveItems();
      updateStats();
    });

    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = Number(btn.closest('li').dataset.id);
      // 키보드로 삭제하면 포커스가 사라지므로 입력창으로 되돌린다 (detail 0 = 키보드 활성화)
      removeItems([id], e.detail === 0);
    });

    // ── 렌더링 ────────────────────────────────────────────────────────────

    function render() {
      listEl.innerHTML = '';

      items.forEach((item) => {
        const li = document.createElement('li');
        li.dataset.id = item.id;
        if (item.checked) li.classList.add('checked');

        const checkboxId = `item-${item.id}`;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'checkbox';
        checkbox.id = checkboxId;
        checkbox.checked = item.checked;

        // label을 쓰면 이름을 눌러도 체크가 되고, 스크린리더가 항목 이름을 읽어 준다.
        const label = document.createElement('label');
        label.className = 'name';
        label.htmlFor = checkboxId;
        label.textContent = item.name;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.setAttribute('aria-label', `${item.name} 삭제`);

        li.append(checkbox, label, deleteBtn);
        listEl.appendChild(li);
      });

      updateStats();
    }

    function updateStats() {
      const done = items.filter((item) => item.checked).length;
      statsEl.textContent = items.length === 0 ? '' : `총 ${items.length}개 중 ${done}개 완료`;
      emptyEl.style.display = items.length === 0 ? 'block' : 'none';

      // 지울 게 있을 때만 일괄 삭제 버튼을 보여 준다.
      clearBtn.hidden = done === 0;
      clearBtn.textContent = `완료 ${done}개 삭제`;
    }

    // ── 화면 전환 ─────────────────────────────────────────────────────────

    // 'main' | 'export' | 'import' | 'code' | 'confirm' 중 하나만 보여 준다.
    function showSyncState(state) {
      syncMain.hidden = state !== 'main';
      exportMenu.hidden = state !== 'export';
      importMenu.hidden = state !== 'import';
      codeInput.hidden = state !== 'code';
      syncConfirm.hidden = state !== 'confirm';
    }

    let pendingItems = null;   // 확인 후 적용할 목록
    let pendingLabel = '';     // 안내 문구에 쓸 출처

    function askOverwrite(list, label) {
      pendingItems = list;
      pendingLabel = label;
      syncQuestion.textContent = `이 브라우저의 목록을 지우고 ${label}의 ${list.length}개로 바꿉니다.`;
      showSyncState('confirm');
      confirmYes.focus();
    }

    confirmNo.addEventListener('click', () => {
      pendingItems = null;
      showSyncState('main');
      exportBtn.focus();
    });

    confirmYes.addEventListener('click', () => {
      const list = pendingItems;
      const label = pendingLabel;
      pendingItems = null;
      showSyncState('main');
      replaceItems(list);
      setStatus(`${label}에서 ${items.length}개를 가져왔습니다.`);
    });

    // ── 파일로 주고받기 ───────────────────────────────────────────────────

    function buildPayload() {
      return {
        app: 'shopping-list',
        version: 1,
        exportedAt: new Date().toISOString(),
        items: items.map((item) => ({ name: item.name, checked: item.checked })),
      };
    }

    function exportFile() {
      const blob = new Blob([JSON.stringify(buildPayload(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `shopping-list-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showSyncState('main');
      setStatus(`${items.length}개를 파일로 내보냈습니다.`);
    }

    // 내보낸 형식과 목록만 든 배열 양쪽을 다 받아 준다.
    function parseImported(source) {
      const list = Array.isArray(source) ? source : source && source.items;
      if (!Array.isArray(list)) throw new Error('목록을 찾을 수 없습니다');
      return normalize(list);
    }

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      try {
        const list = parseImported(JSON.parse(await file.text()));
        askOverwrite(list, '파일');
      } catch (e) {
        console.error('파일을 읽지 못했습니다:', e);
        showSyncState('main');
        setStatus('파일을 읽지 못했습니다. 내보내기로 만든 JSON 파일인지 확인해 주세요.', true);
      }
    });

    // ── 클라우드 (백업 코드) ──────────────────────────────────────────────

    let activeTransfer = null;   // { code, expiresAt }
    let remainingTimer = null;

    // 응답 없는 호스트를 만나도 버튼이 영영 잠기지 않도록 제한을 둔다.
    function withTimeout(promise, message) {
      let timer;
      const limit = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), CLOUD_TIMEOUT_MS);
      });
      return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
    }

    // SDK 없이 PostgREST의 RPC 엔드포인트만 직접 부른다. 외부 스크립트 의존이 없다.
    async function rpc(name, body) {
      const res = await withTimeout(fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      }), '클라우드 응답 시간이 초과되었습니다');

      if (!res.ok) {
        const detail = await res.text().catch(() => '');
        throw new Error(`${res.status} ${detail}`.slice(0, 300));
      }
      return res.json();
    }

    function formatCode(code) {
      return String(code).replace(/(.{4})(?=.)/g, '$1-');
    }

    function remainingText(expiresAt) {
      const ms = new Date(expiresAt).getTime() - Date.now();
      if (!Number.isFinite(ms) || ms <= 0) return null;
      const minutes = Math.floor(ms / 60000);
      const hours = Math.floor(minutes / 60);
      if (hours > 0) return `· ${hours}시간 ${minutes % 60}분 남음`;
      if (minutes > 0) return `· ${minutes}분 남음`;
      return '· 곧 만료';
    }

    function loadTransfer() {
      try {
        const saved = JSON.parse(localStorage.getItem(TRANSFER_KEY));
        if (saved && typeof saved.code === 'string' && saved.expiresAt) return saved;
      } catch (e) {
        console.error('내보내기 상태를 읽지 못했습니다:', e);
      }
      return null;
    }

    function setTransfer(transfer) {
      activeTransfer = transfer;
      if (transfer) localStorage.setItem(TRANSFER_KEY, JSON.stringify(transfer));
      else localStorage.removeItem(TRANSFER_KEY);
      renderTransfer();
    }

    function renderTransfer() {
      clearInterval(remainingTimer);
      if (!activeTransfer) {
        transferBanner.hidden = true;
        return;
      }

      const text = remainingText(activeTransfer.expiresAt);
      if (!text) {
        // 24시간이 지났다. 서버에서도 이미 지워졌다.
        setTransfer(null);
        setStatus('클라우드 내보내기가 만료되었습니다.');
        return;
      }

      transferCode.textContent = formatCode(activeTransfer.code);
      transferRemaining.textContent = text;
      transferBanner.hidden = false;
      remainingTimer = setInterval(renderTransfer, 30000);
    }

    async function exportCloud() {
      exportCloudBtn.disabled = true;
      setStatus('클라우드로 내보내는 중…');
      try {
        // 이전 코드가 살아 있으면 먼저 거둬들여, 떠도는 코드가 남지 않게 한다.
        if (activeTransfer) {
          await rpc('claim_transfer', { p_code: activeTransfer.code }).catch(() => null);
        }

        const result = await rpc('create_transfer', { p_payload: buildPayload() });
        setTransfer({ code: result.code, expiresAt: result.expires_at });
        showSyncState('main');
        setStatus('백업 코드가 만들어졌습니다. 24시간 동안 쓸 수 있습니다.');
      } catch (e) {
        console.error('클라우드 내보내기에 실패했습니다:', e);
        setStatus('내보내지 못했습니다. 네트워크를 확인해 주세요.', true);
      } finally {
        exportCloudBtn.disabled = false;
      }
    }

    async function importCloud() {
      const code = codeField.value.trim();
      if (!code) {
        setStatus('백업 코드를 입력해 주세요.', true);
        return;
      }
      codeSubmitBtn.disabled = true;
      setStatus('클라우드에서 가져오는 중…');
      try {
        const payload = await rpc('claim_transfer', { p_code: code });
        if (!payload) {
          setStatus('코드를 찾을 수 없습니다. 이미 가져갔거나 24시간이 지났을 수 있습니다.', true);
          return;
        }

        const list = parseImported(payload);
        codeField.value = '';
        // 내가 내보낸 코드를 내가 되받은 경우, 서버에서 사라졌으니 상태도 지운다.
        if (activeTransfer && code.replace(/[^0-9A-Za-z]/g, '').toUpperCase() === activeTransfer.code) {
          setTransfer(null);
        }
        askOverwrite(list, '클라우드');
      } catch (e) {
        console.error('클라우드 가져오기에 실패했습니다:', e);
        setStatus('가져오지 못했습니다. 네트워크를 확인해 주세요.', true);
      } finally {
        codeSubmitBtn.disabled = false;
      }
    }

    async function copyCode() {
      const text = formatCode(activeTransfer.code);
      try {
        await navigator.clipboard.writeText(text);
        setStatus('코드를 복사했습니다.');
      } catch (e) {
        console.error('복사하지 못했습니다:', e);
        // 클립보드 권한이 없으면 선택만 해 준다.
        const range = document.createRange();
        range.selectNodeContents(transferCode);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        setStatus('코드를 직접 복사해 주세요.', true);
      }
    }

    // 이미 가져갔거나 만료됐는지 서버에 한 번만 확인한다. 내보낸 상태일 때만 요청이 나간다.
    async function refreshTransfer() {
      if (!activeTransfer) return;
      try {
        const expiresAt = await rpc('transfer_status', { p_code: activeTransfer.code });
        if (!expiresAt) {
          setTransfer(null);
          setStatus('내보낸 코드가 더 이상 유효하지 않습니다. 이미 가져갔거나 만료되었습니다.');
        } else if (expiresAt !== activeTransfer.expiresAt) {
          setTransfer({ code: activeTransfer.code, expiresAt });
        }
      } catch (e) {
        // 오프라인일 수 있다. 남은 시간은 로컬 값으로 계속 보여 준다.
        console.error('내보내기 상태를 확인하지 못했습니다:', e);
      }
    }

    // ── 메뉴 연결 ─────────────────────────────────────────────────────────

    exportBtn.addEventListener('click', () => {
      showSyncState('export');
      exportFileBtn.focus();
    });

    importBtn.addEventListener('click', () => {
      showSyncState('import');
      importFileBtn.focus();
    });

    exportCancelBtn.addEventListener('click', () => {
      showSyncState('main');
      exportBtn.focus();
    });

    importCancelBtn.addEventListener('click', () => {
      showSyncState('main');
      importBtn.focus();
    });

    exportFileBtn.addEventListener('click', exportFile);
    exportCloudBtn.addEventListener('click', exportCloud);

    importFileBtn.addEventListener('click', () => {
      fileInput.value = '';   // 같은 파일을 다시 골라도 change가 오도록 비운다
      fileInput.click();
    });

    importCloudBtn.addEventListener('click', () => {
      codeField.value = '';
      showSyncState('code');
      codeField.focus();
    });

    codeSubmitBtn.addEventListener('click', importCloud);

    codeCancelBtn.addEventListener('click', () => {
      codeField.value = '';
      showSyncState('main');
      importBtn.focus();
    });

    codeField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) importCloud();
    });

    copyCodeBtn.addEventListener('click', copyCode);

    // ── 시작 ──────────────────────────────────────────────────────────────

    items = loadItems();
    render();
    setStatus(DEFAULT_STATUS);
    showSyncState('main');
    input.focus();

    activeTransfer = loadTransfer();
    renderTransfer();
    refreshTransfer();
  </script>
</body>
</html>
